name: CMake on a single platform
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  BUILD_TYPE: Release
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache pacman packages
      uses: actions/cache@v4
      with:
        path: /var/cache/pacman/pkg
        key: ${{ runner.os }}-pacman-${{ hashFiles('.github/workflows/*.yml') }}
        restore-keys: |
          ${{ runner.os }}-pacman-

    - name: Install dependencies
      run: pacman -Sy --noconfirm base-devel abuild rpm-tools dpkg extra-cmake-modules cmake fcitx5 rust cargo

    - name: Cache cargo registry and git deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache corrosion build
      id: cache-corrosion
      uses: actions/cache@v4
      with:
        path: |
          corrosion
          /usr/local/lib/cmake/Corrosion
          /usr/local/lib/libcorrosion*
        key: ${{ runner.os }}-corrosion-v0.5

    - name: Build and install corrosion
      if: steps.cache-corrosion.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/corrosion-rs/corrosion.git
        cmake -S corrosion -B corrosion/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        cmake --build corrosion/build --config ${{env.BUILD_TYPE}}
        cmake --install corrosion/build

    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build
        key: ${{ runner.os }}-cmake-build-${{ hashFiles('**/CMakeLists.txt', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cmake-build-

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
    - name: Release
      run: cd ${{github.workspace}}/build && cpack -C ${{ env.BUILD_TYPE }}
