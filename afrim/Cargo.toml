[package]
name    = "afrim_capi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
afrim-config       = { version = "0.4.8", default-features = false }
afrim-preprocessor = "0.7.0"
afrim-translator   = { version = "0.2.4", default-features = false }
indexmap           = "2"

[features]
default = []
rhai = ["afrim-config/rhai", "afrim-translator/rhai"]
strsim = ["afrim-translator/strsim"]
